name: Test harnfig formula

on:
  push:
    paths:
      - Formula/harnfig.rb
      - .github/workflows/test-harnfig.yml
  pull_request:
    paths:
      - Formula/harnfig.rb
      - .github/workflows/test-harnfig.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      matrix:
        os:
          - macos-15
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: Homebrew/actions/setup-homebrew@9af03b7ae3f9e2ae5c174f659d5c3909f7e7dbac
      - name: Install from the public tap
        run: brew install pfedotovsky/tap/harnfig
      - name: Test the installed formula
        run: |
          harnfig version
          brew test pfedotovsky/tap/harnfig
